<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elf Sisters — Flip Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="viewer-shell">
    <div class="book-stage" aria-label="Interactive flip book">
      <div id="book">
        <div class="page page-cover" data-density="hard">
          <img src="images/cover.svg" alt="Book cover" />
        </div>

        <div class="page">
          <img src="images/page-01.svg" alt="Page 1" />
        </div>

        <div class="page">
          <img src="images/page-02.svg" alt="Page 2" />
        </div>

        <div class="page">
          <img src="images/page-03.svg" alt="Page 3" />
        </div>

        <div class="page">
          <img src="images/page-04.svg" alt="Page 4" />
        </div>

        <div class="page page-cover" data-density="hard">
          <img src="images/back-cover.svg" alt="Back cover" />
        </div>
      </div>
    </div>

    <nav class="book-controls" aria-label="Book controls">
      <button id="prev" type="button">← Previous</button>
      <span id="page-status">Cover</span>
      <button id="next" type="button">Next →</button>
    </nav>

    <p class="hint">Click or drag a page corner to turn the page.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="script.js"></script>
</body>
</html>
