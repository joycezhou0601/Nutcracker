<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elf Sisters — Flip Book</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="viewer-shell">
    <div class="book-stage" aria-label="Interactive flip book">
      <div id="book">
        <div class="page page-cover" data-density="hard">
          <img src="images/cover.jpg" alt="Book cover" />
        </div>

        <div class="page">
          <img src="images/page01.jpg" alt="Page 1" />
        </div>

        <div class="page">
          <img src="images/page02.jpg" alt="Page 2" />
        </div>

        <div class="page">
          <img src="images/page03.jpg" alt="Page 3" />
        </div>

        <div class="page">
          <img src="images/page04.jpg" alt="Page 4" />
        </div>
        <div class="page">
  <img src="images/page05.jpg" alt="Page 5" />
</div>

<div class="page">
  <img src="images/page06.jpg" alt="Page 6" />
</div>

<div class="page">
  <img src="images/page07.jpg" alt="Page 7" />
</div>

<div class="page">
  <img src="images/page08.jpg" alt="Page 8" />
</div>

        <div class="page page-cover" data-density="hard">
          <img src="images/back.jpg" alt="Back cover" />
        </div>
      </div>
    </div>

    <nav class="book-controls" aria-label="Book controls">
      <button id="prev" type="button">← Previous</button>
      <span id="page-status">Cover</span>
      <button id="next" type="button">Next →</button>
    </nav>

    <p class="hint">Click or drag a page corner to turn the page.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="script.js"></script>
</body>
</html>
